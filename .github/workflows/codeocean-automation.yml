name: Code Ocean Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  submit-computation:
    runs-on: ubuntu-latest
    env:
      CODEOCEAN_DOMAIN: codeocean.allenneuraldynamics.org
      CODEOCEAN_API_TOKEN: ${{ secrets.CODEOCEAN_API_TOKEN }}
      CO_PIPELINE_ID: ${{ vars.CO_PIPELINE_ID }}
    steps:
      - name: Submit computation
        run: |
          cat > payload.json <<EOF
          {
            "pipeline_id": "${CO_PIPELINE_ID}",
            "processes": [
              {
                "name": "capsule_aind_analysis_job_dispatch_3",
                "named_parameters": [
                  {
                    "param_name": "docdb_query",
                    "value": "/data/input_files/input_query.json"
                  },
                  {
                    "param_name": "file_extension",
                    "value": "nwb.zarr"
                  },
                  {
                    "param_name": "filter_latest",
                    "value": "data_description.creation_time"
                  },
                  {
                    "param_name": "filter_by",
                    "value": "acquisition.acquisition_start_time"
                  },
                  {
                    "param_name": "docdb_version",
                    "value": "v2"
                  },
                  {
                    "param_name": "max_number_of_tasks_dispatched",
                    "value": "10"
                  }
                ]
              },
              {
                "name": "capsule_aind_analysis_wrapper_df_model_fitting_4",
                "named_parameters": [
                  {
                    "param_name": "dry_run",
                    "value": "0"
                  }
                ]
              }
            ]
          }
          EOF

          curl --fail-with-body --show-error \
            --request POST "https://${CODEOCEAN_DOMAIN}/api/v1/computations" \
            --header "Content-Type: application/json" \
            --user "${CODEOCEAN_API_TOKEN}:" \
            --data @payload.json